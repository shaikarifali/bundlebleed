[project]
name = "bundlebleed"
version = "0.30.2"
description = "Scope-gated JS recon and secret/endpoint extraction for authorized bug bounty testing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "jsbeautifier>=1.15",
    "networkx>=3.2",
    "anthropic>=0.40",
    "dnspython>=2.6",
]

[project.optional-dependencies]
runtime = ["playwright>=1.40"]

[project.scripts]
bundlebleed = "bundlebleed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundlebleed"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
    "playwright>=1.40",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bundlebleed"]

[[tool.mypy.overrides]]
module = "jsbeautifier"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
