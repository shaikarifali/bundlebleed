# Secret detection patterns. `severity` feeds report classification.
# Matches are NEVER stored in plaintext (CLAUDE.md Invariant 7) — the
# extractor stores secret_type + a redacted preview + a partial hash only.
#
# Prefer structurally distinctive, vendor-specific formats (a fixed prefix
# and/or fixed length) over bare-entropy heuristics — false positives on
# minified JS (full of random-looking short identifiers) are a well-known
# failure mode of naive secret scanners, and precision matters more than
# raw recall here since every match becomes a hypothesis a human reviews.
patterns:
  - name: aws_access_key
    regex: 'AKIA[0-9A-Z]{16}'
    severity: critical

  - name: aws_secret_key
    regex: '(?i)aws(?:_|-)?(?:secret|private)_?(?:access_?)?key[''"]?\s*[:=]\s*[''"][A-Za-z0-9/+=]{40}[''"]'
    severity: critical

  - name: google_api_key
    regex: 'AIza[0-9A-Za-z\-_]{35}'
    severity: high

  - name: stripe_live_key
    regex: 'sk_live_[0-9a-zA-Z]{24}'
    severity: high

  - name: stripe_test_key
    regex: 'sk_test_[0-9a-zA-Z]{24}'
    severity: medium

  - name: jwt_token
    # Signature segment allows zero chars too -- a genuine "alg":"none" token
    # is unsigned (header.payload. with nothing after the last dot), and
    # that exact shape must still be recognized as a JWT to decode its
    # header and flag it (see jwt_alg_none in extractors/secrets.py).
    regex: 'eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]*'
    severity: medium

  - name: firebase_config
    regex: '[a-zA-Z0-9-]+\.firebaseio\.com'
    severity: medium

  - name: github_token
    regex: 'gh[pousr]_[A-Za-z0-9_]{36,}'
    severity: high

  - name: slack_token
    regex: 'xox[baprs]-[0-9a-zA-Z-]+'
    severity: high

  - name: slack_webhook_url
    regex: 'https://hooks\.slack\.com/services/[A-Za-z0-9/]+'
    severity: high

  - name: twilio_account_sid
    regex: 'AC[0-9a-fA-F]{32}'
    severity: medium

  - name: twilio_api_key_sid
    regex: 'SK[0-9a-fA-F]{32}'
    severity: medium

  - name: sendgrid_api_key
    regex: 'SG\.[A-Za-z0-9_\-\.]{66}'
    severity: high

  - name: mailgun_api_key
    regex: 'key-[0-9a-zA-Z]{32}'
    severity: medium

  - name: npm_token
    regex: 'npm_[A-Za-z0-9]{36}'
    severity: high

  - name: discord_webhook
    regex: 'https://discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_\-]+'
    severity: medium

  - name: discord_bot_token
    regex: '[MN][A-Za-z\d]{23}\.[\w-]{6}\.[\w-]{27}'
    severity: high

  - name: square_access_token
    regex: 'sq0atp-[0-9A-Za-z\-_]{22}'
    severity: high

  - name: square_oauth_secret
    regex: 'sq0csp-[0-9A-Za-z\-_]{43}'
    severity: high

  - name: shopify_access_token
    regex: 'shp(?:at|ss|pa)_[a-fA-F0-9]{32}'
    severity: high

  - name: mapbox_token
    regex: 'pk\.[A-Za-z0-9]{60,}\.[A-Za-z0-9]{20,}'
    severity: medium

  - name: paypal_braintree_access_token
    regex: 'access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32}'
    severity: critical

  - name: gcp_service_account_key
    regex: '"type"\s*:\s*"service_account"'
    severity: critical

  - name: azure_storage_account_key
    regex: 'AccountKey=[A-Za-z0-9+/]{86}=='
    severity: critical

  - name: private_key_block
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    severity: critical

  - name: pgp_private_key_block
    regex: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    severity: critical

  - name: basic_auth_header
    regex: 'Authorization[^\n]{0,40}Basic\s+[A-Za-z0-9+/=]+'
    severity: high

  - name: generic_bearer_token
    regex: 'Authorization[^\n]{0,40}Bearer\s+[A-Za-z0-9\-_\.]{20,}'
    severity: medium

  - name: generic_api_key_assignment
    regex: '(?i)\bapi[_-]?key\b\s*[:=]\s*[''"][A-Za-z0-9\-_]{16,}[''"]'
    severity: medium

  - name: internal_ip
    regex: '(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})'
    severity: low

  - name: hardcoded_password
    regex: 'password\s*[:=]\s*[''"][^''"]+[''"]'
    severity: medium

  # --- AI/LLM provider keys -- one of the most common accidental
  # frontend leaks since 2023-2024 (a client calling a model API directly
  # instead of proxying through a backend).
  - name: openai_api_key
    # 'T3BlbkFJ' is base64("OpenAI") embedded mid-string in the classic key
    # format -- a near-zero-false-positive anchor even in minified JS.
    regex: 'sk-(?:proj-|svcacct-|admin-|service-)?[A-Za-z0-9_\-]{20,74}T3BlbkFJ[A-Za-z0-9_\-]{20,74}'
    severity: critical

  - name: anthropic_api_key
    regex: 'sk-ant-api03-[a-zA-Z0-9_\-]{93}AA'
    severity: critical

  - name: anthropic_admin_api_key
    regex: 'sk-ant-admin01-[a-zA-Z0-9_\-]{93}AA'
    severity: critical

  - name: huggingface_token
    regex: '(?:hf_|api_org_)[A-Za-z0-9]{34}'
    severity: high

  - name: cohere_api_token
    regex: '(?i)cohere[\w.\-]{0,20}[\s"=:]{1,5}[A-Za-z0-9]{40}'
    severity: high

  # --- Modern backend-as-a-service platforms
  - name: supabase_management_pat
    regex: 'sbp_[a-f0-9]{40}'
    severity: critical

  - name: supabase_secret_key
    # 2025 key-format migration (replaces the service_role JWT) -- must
    # never appear in a browser bundle, since it bypasses RLS entirely.
    regex: 'sb_secret_[A-Za-z0-9_\-]{20,}'
    severity: critical

  - name: clerk_secret_key
    # No official TruffleHog/Gitleaks detector exists yet as of this
    # writing -- derived from Clerk's documented key format. The 40+ char
    # length floor keeps this from colliding with our stripe_test_key /
    # stripe_live_key patterns (which are exactly 24 chars).
    regex: 'sk_(?:live|test)_[A-Za-z0-9]{40,}'
    severity: high

  - name: planetscale_token
    regex: 'pscale_(?:tkn|oauth)_[\w=.\-]{32,64}'
    severity: high

  - name: posthog_personal_api_key
    # 'phx_' only -- NOT 'phc_', which is PostHog's intentionally-public
    # project key shipped by design in every frontend snippet.
    regex: 'phx_[A-Za-z0-9_]{43,48}'
    severity: high

  # --- Cloud / infra provider tokens
  - name: cloudflare_global_api_key
    regex: '(?i)cloudflare[\w.\-]{0,20}[\s"=:]{1,5}[a-f0-9]{37}'
    severity: critical

  - name: cloudflare_api_token
    regex: '(?i)cloudflare[\w.\-]{0,20}[\s"=:]{1,5}[a-zA-Z0-9_\-]{40}'
    severity: high

  - name: digitalocean_pat
    regex: 'dop_v1_[a-f0-9]{64}'
    severity: high

  - name: sentry_org_auth_token
    # The plain Sentry DSN is intentionally public and NOT flagged here --
    # this is the distinct org-auth-token format (project/org admin API).
    regex: 'sntrys_eyJ[a-zA-Z0-9=_+/]{197}'
    severity: high

  - name: heroku_api_key_v2
    # Prefer this over a bare-UUID Heroku rule -- a bare UUID shape floods
    # JS bundles with false positives (session/tracking/request ids).
    regex: 'HRKU-AA[0-9a-zA-Z_\-]{58}'
    severity: medium

  # --- Source control / API tooling tokens
  - name: gitlab_pat
    regex: 'glpat-[\w\-]{20}'
    severity: high

  - name: github_fine_grained_pat
    regex: 'github_pat_[A-Za-z0-9_]{82}'
    severity: high

  - name: postman_api_key
    regex: 'PMAK-[a-f0-9]{24}-[a-f0-9]{34}'
    severity: medium

  - name: notion_api_token
    regex: 'ntn_[0-9]{11}[A-Za-z0-9]{35}'
    severity: high

  - name: algolia_admin_api_key
    # Requires 'admin' near the keyword specifically to avoid matching
    # Algolia's intentionally-public search-only key, which has the exact
    # same 32-char shape and ships in nearly every Algolia-powered frontend.
    regex: '(?i)algolia[\w.\-]{0,20}admin[\w.\-]{0,20}[\s"=:]{1,5}[a-zA-Z0-9]{32}'
    severity: medium

  # --- Exposure markers: not a credential, but a literal reference whose
  # mere presence in a public bundle is itself the finding. These get
  # their own bug_classes in hypotheses/engine.py rather than the default
  # "Hardcoded Credential Exposure" treatment.
  - name: graphql_introspection_reference
    # A hardcoded introspection query/operation name only appears in a
    # bundle when a client performs (or a devtools panel offers) schema
    # introspection -- worth a single, safe verification query.
    regex: 'IntrospectionQuery|__schema\s*\{|possibleTypes\s*\{'
    severity: medium

  - name: cloud_storage_reference
    # A hostname shaped like a cloud storage bucket/blob container,
    # referenced directly in JS -- a subdomain/bucket-takeover candidate
    # if the bucket no longer exists.
    regex: '[a-z0-9][a-z0-9.\-]*\.s3(?:-website)?(?:[.\-][a-z0-9\-]+)?\.amazonaws\.com|[a-z0-9\-]+\.blob\.core\.windows\.net|[a-z0-9\-]+\.storage\.googleapis\.com'
    severity: medium

  - name: cloud_metadata_reference
    # A cloud instance-metadata endpoint hardcoded into CLIENT-side JS is
    # unusual enough to mean the frontend proxies it through a backend
    # route -- exactly the kind of route an SSRF-shaped param would target.
    regex: '169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|/latest/meta-data/|/computeMetadata/v1/'
    severity: critical

  - name: exposed_api_docs_path
    regex: '/swagger\.json|/swagger-ui|/v2/api-docs|/openapi\.json|/api-docs|/redoc'
    severity: medium

  - name: exposed_vcs_config_path
    regex: '\.git/config|\.git/HEAD|/\.env\b|/\.DS_Store|/\.svn/|/\.aws/credentials'
    severity: high

  - name: internal_hostname_reference
    # Deliberately low severity/confidence -- a recon lead (a
    # non-public-facing hostname baked into a public bundle), not itself a
    # vulnerability, and staging/dev naming has real false-positive risk.
    #
    # The lookbehind only excludes the keyword being glued directly onto a
    # longer alphanumeric run with no separator (e.g. "devops"/"supdev" --
    # a real false-positive source). It deliberately allows '.' and '-'
    # immediately before the keyword, because those are the two most common
    # ways this actually appears in a real hostname: as a non-first label
    # ('app.internal.example.com') or a hyphenated compound label
    # ('api-internal.example.com') -- a stricter lookbehind that excluded
    # both of those meant this pattern could only ever match a keyword
    # sitting in the very first label of a string, missing most real cases.
    regex: '(?<![a-zA-Z0-9])(?:stg|stage|staging|dev|internal|corp|backend-prod|admin-int)\.[a-z0-9\-]+\.[a-z]{2,}|[a-z0-9\-]+\.svc\.cluster\.local'
    severity: low
